<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · Your Law Firm</title>
  <meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)" />
  <script>
    // Apply the saved theme before first paint to avoid a flash. No saved value = follow the system.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="theme-switch theme-switch--floating" role="group" aria-label="Color theme">
    <button type="button" data-theme-choice="light" aria-pressed="false" title="Light theme" aria-label="Light theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark theme" aria-label="Dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button type="button" data-theme-choice="system" aria-pressed="true" title="Match system" aria-label="Match system theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
  </div>
    <main class="auth">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="auth__card">
      <a href="/" class="logo" aria-label="Your Law Firm home">
        <span class="logo__be">your</span><span class="logo__human">law</span><span class="logo__ai">FIRM</span>
      </a>

      <section id="signed-out" hidden>
        <h1>Log in</h1>
        <p>Sign in to your client portal.</p>
        <button type="button" id="google-btn" class="btn btn--google">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
      </section>

      <section id="signed-in" hidden>
        <img id="profile-avatar" class="profile__avatar" alt="" referrerpolicy="no-referrer" hidden />
        <span id="profile-initial" class="profile__initial" aria-hidden="true"></span>
        <p class="eyebrow">Welcome back</p>
        <h1 id="profile-name" class="profile__name"></h1>
        <p id="profile-email" class="profile__email"></p>
        <div class="auth__actions">
          <a href="/" class="btn btn--primary">Go to home</a>
          <button type="button" id="sign-out" class="btn btn--ghost">Sign out</button>
        </div>
      </section>

      <p id="auth-error" class="auth__error" role="alert" hidden></p>
      <a href="/" class="link auth__back" id="back-link">&larr; Back to home</a>
    </div>
  </main>
  <script src="/theme.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
